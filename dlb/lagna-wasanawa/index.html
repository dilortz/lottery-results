<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lagna Wasanawa | LankaLotto</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .lottery-name {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .draw {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .letter {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 15px auto;
        }

        .numbers {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .number {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #111827;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>🇱🇰 LankaLotto</h1>
    <p>ලොතරැයි ප්‍රතිඵල</p>
</header>

<div class="container">

    <div class="card">

        <div class="lottery-name">
            🎟️ Ada Kotipathi
        </div>

        <div class="draw">
            Draw No. — Coming Soon
        </div>

        <div class="letter">
            A
        </div>

        <div class="numbers">
            <div class="number">00</div>
            <div class="number">00</div>
            <div class="number">00</div>
            <div class="number">00</div>
        </div>

    </div>

    <a class="back" href="../../..">
        ← Back to LankaLotto
    </a>

</div>

<footer>
    © 2026 LankaLotto
</footer>

</body>
</html>
